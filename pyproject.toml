[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavkit"
version = "0.1.0"
description = "MAVLink toolkit for gimbal, camera, and payload control (ArduPilot / H-16)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mavkit contributors" }]
keywords = ["mavlink", "ardupilot", "gimbal", "camera", "gcs", "h16", "payload"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pymavlink>=2.4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/example/mavkit"
Issues = "https://github.com/example/mavkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mavkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
